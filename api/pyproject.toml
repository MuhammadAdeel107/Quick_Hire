[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Muhammad Adeel Arshad", email = "adeelarshad1155@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.162.5",
    "google-auth>=2.62.0",
    "google-genai>=3.0.0",
    "gspread>=6.2.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.20",
    "oauth2client>=4.1.3",
    "ollama>=0.6.3",
    "pandas>=3.1.0",
    "playwright>=1.65.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "python-jobspy>=1.4.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
